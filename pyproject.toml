[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lps"
version = "0.1.0"
description = "LinkedIn profile crawl pipeline (Apify harvestapi -> Postgres)"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=1.7",
    "psycopg[binary]>=3.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
